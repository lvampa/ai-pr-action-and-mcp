# Builds the composite action’s Linux binary on version tags and commits it under
# `bin/` so consumers can use the action without compiling Rust on each run.
# Target is x86_64-unknown-linux-musl (static) so the binary runs on Alpine, mixed
# glibc versions, and self-hosted runners—not only GitHub’s Ubuntu images.
# See docs/specs/release-workflow/requirements.md

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build action binary
        run: bash scripts/build-action-binary.sh

      - name: Commit binary if changed
        id: release
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git cat-file -e "HEAD:bin/ai-pr-action" 2>/dev/null; then
            git show "HEAD:bin/ai-pr-action" > "$RUNNER_TEMP/ai-pr-action.previous"
            if cmp -s bin/ai-pr-action "$RUNNER_TEMP/ai-pr-action.previous"; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          git add bin/ai-pr-action
          git commit -m "chore(release): Linux x86_64 (musl) binary for ${{ github.ref_name }}"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Push tag (binary commit)
        if: steps.release.outputs.skip == 'false'
        # Tag is moved to include the binary commit (non–fast-forward update).
        run: git push origin "+HEAD:${{ github.ref }}"
