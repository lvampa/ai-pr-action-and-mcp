name: "AI PR Review"
description: "Automated pull request code review powered by Claude or OpenAI"
author: "Connor Abdelnoor"

inputs:
  github-token:
    description: "GitHub token for posting PR comments"
    required: true
  anthropic-api-key:
    description: "Anthropic API key (required when provider is anthropic)"
    required: false
  openai-api-key:
    description: "OpenAI API key (required when provider is openai)"
    required: false
  provider:
    description: "Override the AI provider (anthropic or openai)"
    required: false
  model:
    description: "Override the AI model"
    required: false

runs:
  using: composite
  steps:
    - name: Run AI PR Review
      shell: bash
      run: |
        chmod +x "${{ github.action_path }}/bin/ai-pr-action"
        "${{ github.action_path }}/bin/ai-pr-action"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        INPUT_OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_MODEL: ${{ inputs.model }}
