[package]
name = "ai-cr-action"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# GitHub API
octocrab = "0.44"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
figment = { version = "0.10", features = ["yaml", "env"] }

# MCP server
rmcp = { version = "0.16.0", features = ["server"] }
rmcp-macros = "0.16.0"
schemars = "0.8"

# CLI args
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Retry / backoff
backoff = { version = "0.4", features = ["tokio"] }

# File filtering
globset = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mockito = "1"
tokio-test = "0.4"
