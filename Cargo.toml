[workspace]
members = [
    "crates/ai-pr-core",
    "crates/ai-pr-action",
    "crates/ai-pr-mcp",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = "deny"

[workspace.dependencies]
# Core shared lib
ai-pr-core = { path = "crates/ai-pr-core" }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP / GitHub
reqwest = { version = "0.12", features = ["json"] }
octocrab = "0.44"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Config
figment = { version = "0.10", features = ["yaml", "env"] }

# MCP server (ai-pr-mcp only)
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
rmcp-macros = "0.16.0"
schemars = "1"

# CLI / logging
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Retry / file filtering
backoff = { version = "0.4", features = ["tokio"] }
globset = "0.4"

# Testing
mockito = "1"
tokio-test = "0.4"
tempfile = "3"
